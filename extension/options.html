<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>True Cost options</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { margin: 16px; min-width: 320px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      button { margin-top: 8px; padding: 6px 12px; font: inherit; }
      :focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
      p { margin: 4px 0; }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="app-url">True Cost app address</label>
      <input id="app-url" type="url" required aria-describedby="hint" placeholder="http://localhost:3000" />
      <p id="hint">Where listings are sent, for example your Vercel URL. Nothing else leaves your browser.</p>
      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
