<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>True Cost options</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { margin: 16px; min-width: 320px; }
      fieldset { border: 0; margin: 0; padding: 0; }
      legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
      .choice { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
      input[type="url"] { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; margin-top: 4px; }
      button { margin-top: 8px; padding: 6px 12px; font: inherit; }
      :focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
      p { margin: 4px 0; }
    </style>
  </head>
  <body>
    <form id="form">
      <fieldset aria-describedby="hint">
        <legend>Send listings to</legend>
        <div class="choice">
          <input type="radio" name="target" id="target-deployed" value="deployed" />
          <label for="target-deployed">True Cost (<span id="deployed-url"></span>)</label>
        </div>
        <div class="choice">
          <input type="radio" name="target" id="target-local" value="local" />
          <label for="target-local">Local development (<span id="local-url"></span>)</label>
        </div>
        <div class="choice">
          <input type="radio" name="target" id="target-custom" value="custom" />
          <label for="target-custom">Another address</label>
        </div>
        <input id="app-url" type="url" aria-label="Other app address" placeholder="https://your-app.vercel.app" />
      </fieldset>
      <p id="hint">Only the app gets the listing's screenshots and text. Nothing else leaves your browser.</p>
      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <script type="module" src="options.js"></script>
  </body>
</html>
